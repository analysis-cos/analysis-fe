services:
  app:
    build:
      context: .
      target: runner
    image: analysis-fe:latest
    ports:
      - "${APP_PORT:-3000}:80"
    restart: unless-stopped

  app-dev:
    image: node:20-alpine
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      - app-dev-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  app-dev-node-modules:
